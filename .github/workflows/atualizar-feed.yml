name: Atualizar feed de produtos

on:
  schedule:
    - cron: "0 9,21 * * *"   # 06h e 18h (horário de Brasília)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar feed
        run: python3 gerar_feed.py produtos.xml
      - name: Publicar alterações
        run: |
          git config user.name "asetech-feed-bot"
          git config user.email "asetech-feed-bot@users.noreply.github.com"
          git add produtos.xml
          git diff --cached --quiet || git commit -m "Atualiza feed de produtos"
          git push
